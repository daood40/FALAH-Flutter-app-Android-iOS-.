[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["raw", "templates", "exports", "out", "outbox", "backups",
           "review", "review_sample", "mobile", "fonts", "icons", "__pycache__"]

[tool.ruff.lint]
# ما يُوقف الدفع: أخطاءٌ حقيقية لا أذواق.
#   F   — أسماءٌ غير معرَّفة، استيرادٌ لا يُستعمل، تعريفٌ مكرَّر
#   E9  — خطأٌ نحويّ أو مسافاتٌ مختلطة
#   B   — مزالقُ معروفة (حجّةٌ افتراضية متغيّرة، استثناءٌ مبتلَع…)
#   S   — أنماطٌ أمنية (subprocess بلا تقييد، assert في الإنتاج…)
select = ["F", "E9", "B", "S102", "S105", "S106", "S108", "S301", "S324", "S501"]

# أسلوبُ هذا المشروع مقصود، لا سهو: الشرطُ القصير في سطره
# (`if not r: return None`) أوضحُ من ثلاثة أسطر، والاستيرادُ المؤجَّل داخل
# الدالّة يكسر حلقاتِ الاستيراد ويؤخّر تحميل ما لا يُستعمل في كل طلب.
# إسقاطُ هذه القواعد قرارٌ مكتوب، لا تجاهلٌ لتحسين رقم.
ignore = [
  "E701", "E702", "E731", "E741", "E401", "E402",
  # B904 (`raise ... from`) و B007 (متغيّر حلقةٍ غير مستعمل): أسلوبٌ لا عطب.
  # سلاسلُ الاستثناءات هنا مقصودة: `GoogleError("فشل الرفع 403: …")` أوضحُ
  # للمستخدم من أثرٍ يحمل استثناء urllib تحته. تبقى مرصودةً لا مسكوتًا عنها.
  "B904", "B007",
]

[tool.ruff.lint.per-file-ignores]
"tests.py"        = ["F841", "S101", "S105", "S106"]   # الاختبار يُصرّح بأسرارٍ وهمية
"ui_audit.py"     = ["F841", "S101", "S105", "S106"]
"failure_test.py" = ["F841", "S101", "S105", "S106"]
"security_scan.py" = ["S105", "S106"]                   # أنماط الكشف نفسها
"falah/stores/google.py" = ["S105"]                    # TOKEN رابطٌ لا سرّ
"audit.py"        = ["F841", "S101", "S105", "S106", "S108"]  # ملفّات فحصٍ مؤقّتة

[tool.mypy]
python_version = "3.11"
# الفحص متدرّج: يبدأ بما يمنع الانهيار (استدعاءٌ لدالّةٍ غير موجودة، وسيطٌ
# ناقص) لا بإلزام كل تعليقٍ نوعيّ. التشديد يأتي حين تُوسم الوحدات.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false
exclude = ["raw/", "templates/", "exports/", "out/", "mobile/", "build/"]

# `build.py` **داخلٌ في الفحص الآن**: هو ما يبني قاعدة المحتوى، وخطأُ نوعٍ
# فيه خطأٌ في النصوص لا في أداة. كان مستثنًى فأُدخل، وسقطت أخطاؤه بعد أن
# رُفعت الأداةُ ونُظّفت الاستيرادات، فلم يعد للاستثناء سبب.
#
# ما يبقى خارجًا: حزمُ الفحص نفسها وأدواتُ التشغيل المساعدة. وسببُ ذلك
# صريح: هي تتلاعب بالأنواع **عمدًا** لتختبر الحدود — تمرّر نصًّا حيث
# يُنتظر رقمٌ، وتحقن استثناءات، وتعيد تعريف وحداتٍ في أثناء التشغيل. إلزامُها
# بالأنواع يعني منعَها من فعل ما وُجدت له.
[[tool.mypy.overrides]]
module = ["tests", "audit", "ui_audit", "failure_test", "leak_test", "discovery",
          "batch", "build_preview", "preview_data", "export_snapshot",
          "fetch_en", "fetch_enc", "review_pack", "store_cli", "icons"]
ignore_errors = true
