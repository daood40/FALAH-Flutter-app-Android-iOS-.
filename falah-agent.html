<title>وكيل فلاح</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#13110C;
  --ink-2:#1B1811;
  --ink-3:#232016;
  --line:#332E22;
  --line-soft:#2A251B;
  --paper:#EFE8D6;
  --paper-dim:#B4A98F;
  --paper-faint:#7E7563;
  --gold:#C9A247;
  --gold-dim:#8A6F2E;
  --sage:#79A06B;
  --amber:#C8853E;
  --rose:#B5604F;
  --parch:#E9DCBB;
  --parch-2:#DCCBA1;
  --parch-ink:#33291A;
  --parch-ink-2:#6B5B3E;
  --r:14px;
  --ui:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --serif:"Amiri",Georgia,serif;
  --quran:"Amiri Quran","Amiri",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ink);color:var(--paper);
  font-family:var(--ui);direction:rtl;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 80% at 50% -10%, #201C13 0%, transparent 60%),
    radial-gradient(90% 60% at 100% 110%, #1A1710 0%, transparent 55%);
  background-attachment:fixed;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:rgba(201,162,71,.28)}

.frame{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  border-inline:1px solid var(--line-soft);background:linear-gradient(180deg,#16130E,#131009);}
@media(min-width:560px){.frame{min-height:100vh}}

/* ---------- shared bits ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--paper-faint);text-transform:uppercase}
.mark{display:block}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}

/* ---------- auth ---------- */
#auth{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:40px 26px 34px}
.brandwrap{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.brand-name{font-family:var(--serif);font-size:52px;font-weight:700;line-height:1;color:var(--paper);margin:0;letter-spacing:.01em}
.brand-sub{margin:0;color:var(--paper-dim);font-size:14.5px;line-height:1.75;max-width:30ch}
.rule{display:flex;align-items:center;gap:12px;color:var(--paper-faint);font-size:11.5px;font-family:var(--mono)}
.rule::before,.rule::after{content:"";height:1px;flex:1;background:var(--line)}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;color:var(--paper-dim)}
input[type=text],input[type=email]{
  width:100%;padding:13px 14px;border-radius:11px;background:var(--ink-2);
  border:1px solid var(--line);color:var(--paper);font-family:inherit;font-size:15px}
input::placeholder{color:#5F5747}
input:focus{border-color:var(--gold-dim);outline:none}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:11px;
  font-size:15px;font-weight:600;transition:transform .12s ease,background .2s ease,border-color .2s ease}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(180deg,#D8B155,#B98F32);color:#231A06}
.btn-ghost{border:1px solid var(--line);background:var(--ink-2);color:var(--paper)}
.btn-ghost:hover{border-color:var(--gold-dim)}
.legal{font-size:11.5px;color:var(--paper-faint);text-align:center;line-height:1.7;margin:0}

/* ---------- console ---------- */
#app{flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:rgba(19,16,11,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.topbar .t-name{font-family:var(--serif);font-size:21px;font-weight:700;line-height:1}
.chip{font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);
  color:var(--paper-dim);white-space:nowrap}
.chip.on{border-color:var(--gold-dim);color:var(--gold);background:rgba(201,162,71,.08)}
.spacer{flex:1}

.stream{flex:1;padding:18px 16px 26px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.av{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--ink-2);margin-top:2px}
.bubble{flex:1;min-width:0;font-size:15px;line-height:1.85;color:var(--paper)}
.msg.me .bubble{background:var(--ink-3);border:1px solid var(--line);border-radius:13px 13px 4px 13px;
  padding:10px 13px;font-size:14.5px;color:#DCD3BE}
.msg.me{flex-direction:row-reverse}
.msg.me .av{background:transparent;border-color:var(--line-soft)}
.example{margin-top:9px;font-size:12.5px;color:var(--paper-faint);border-inline-start:2px solid var(--line);
  padding-inline-start:10px;line-height:1.7}
.example b{color:var(--paper-dim);font-weight:500}

.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--ink-2);
  font-size:14px;transition:border-color .18s,background .18s,transform .12s}
.opt:hover{border-color:var(--gold-dim);background:#221E14}
.opt:active{transform:translateY(1px)}
.opt .sub{display:block;font-size:11.5px;color:var(--paper-faint);margin-top:3px}

.inline-form{display:flex;gap:8px;margin-top:12px}
.inline-form input{flex:1}

.think{display:flex;align-items:center;gap:9px;color:var(--paper-faint);font-size:13px;font-family:var(--mono)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:pulse 1.1s infinite ease-in-out}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

/* ---------- verification panel ---------- */
.panel{border:1px solid var(--line);border-radius:var(--r);background:#191610;overflow:hidden;margin-top:12px}
.panel-hd{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line-soft);
  background:#1D1912}
.panel-hd h3{margin:0;font-size:13.5px;font-weight:600}
.panel-bd{padding:6px 13px 12px}
.prog{font-family:var(--mono);font-size:11px;color:var(--paper-dim);font-variant-numeric:tabular-nums}
.stage{border-bottom:1px solid var(--line-soft)}
.stage:last-child{border-bottom:0}
.stage-hd{display:flex;align-items:center;gap:9px;width:100%;padding:10px 13px;text-align:right;font-size:12.5px;
  color:var(--paper-dim);font-weight:600}
.stage-hd .n{font-family:var(--mono);font-size:10px;color:var(--gold-dim);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;flex:none}
.stage-hd .tally{margin-inline-start:auto;font-family:var(--mono);font-size:10.5px;color:var(--paper-faint);
  font-variant-numeric:tabular-nums}
.stage.pass .stage-hd .tally{color:var(--sage)}
.stage.fail .stage-hd .tally{color:var(--rose)}
.stage-bd{padding:0 13px 8px}
.check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:13.5px;line-height:1.6;
  border-bottom:1px dashed var(--line-soft);opacity:.35;transition:opacity .3s}
.check:last-child{border-bottom:0}
.check.live,.check.done{opacity:1}
.check .st{flex:none;width:17px;height:17px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-size:10px}
.check.live .st{border-color:var(--gold);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.check.pass .st{border-color:var(--sage);color:var(--sage)}
.check.fail .st{border-color:var(--rose);color:var(--rose)}
.check .lbl{flex:1}
.check .src{display:block;font-family:var(--mono);font-size:11px;color:var(--paper-faint);margin-top:3px;direction:ltr;text-align:right}
/* source comparison */
.cmp{margin:8px 0 4px;border:1px solid var(--line-soft);border-radius:10px;background:#151209;overflow:hidden;
  animation:rise .3s ease both}
.cmp-hd{padding:8px 11px;border-bottom:1px solid var(--line-soft);font-size:11.5px;color:var(--paper-faint);
  display:flex;align-items:center;gap:7px}
.cmp-txt{padding:9px 11px;font-family:var(--serif);font-size:14.5px;line-height:2;color:#DCD3BE;
  border-bottom:1px solid var(--line-soft);background:#12100A}
.cmp-txt mark{background:rgba(181,96,79,.28);color:#E8B4A8;border-radius:3px;padding:0 3px;
  text-decoration:underline wavy rgba(181,96,79,.8);text-underline-offset:5px}
.cmp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;
  border-bottom:1px dashed var(--line-soft);font-size:12.5px}
.cmp-row:last-child{border-bottom:0}
.cmp-row .s{color:var(--paper-dim);line-height:1.5}
.cmp-row .v{font-family:var(--mono);font-size:10.5px;white-space:nowrap;padding:3px 7px;border-radius:6px;
  border:1px solid var(--line);direction:ltr}
.cmp-row .v.ok{color:var(--sage);border-color:rgba(121,160,107,.45);background:rgba(121,160,107,.08)}
.cmp-row .v.bad{color:var(--rose);border-color:rgba(181,96,79,.5);background:rgba(181,96,79,.1)}
.verdict{display:flex;align-items:center;gap:9px;padding:11px 13px;font-size:13.5px;font-weight:600;
  border-top:1px solid var(--line-soft)}
.verdict.ok{color:var(--sage);background:rgba(121,160,107,.07)}
.verdict.no{color:var(--rose);background:rgba(181,96,79,.08)}

/* ---------- slide ---------- */
.slidewrap{margin-top:14px}

/* ===== card skins: identical structure, three visual worlds ===== */
.slide{
  --frame:linear-gradient(150deg,#0A1512,#050B09 55%,#0C1A15);
  --page:radial-gradient(120% 85% at 50% 30%, #12241D 0%, #0A1512 55%, #050A08 100%);
  --ink:#F0E5CA; --sub:#A08F63; --rule:rgba(201,162,71,.42); --hair:rgba(201,162,71,.16);
  --edge:rgba(201,162,71,.30); --glow:rgba(201,162,71,.10);
  position:relative;width:100%;border-radius:8px;overflow:hidden;
  padding:9px;background:var(--frame);
  box-shadow:0 16px 38px rgba(0,0,0,.5);
  aspect-ratio:1/1;transition:aspect-ratio .3s ease;display:flex}
.slide[data-skin="parch"]{
  --frame:linear-gradient(150deg,#6B4E24,#3B2A11 55%,#57401C);
  --page:radial-gradient(100% 70% at 50% 45%, #F1E6C9 0%, #E4D4AC 62%, #CDB88B 100%);
  --ink:#2A2113; --sub:#826E45; --rule:rgba(107,91,62,.55); --hair:rgba(107,91,62,.22);
  --edge:rgba(107,91,62,.35); --glow:rgba(80,60,26,.30)}
.slide[data-skin="ivory"]{
  --frame:linear-gradient(150deg,#DED8CA,#C9C2B2);
  --page:linear-gradient(170deg,#FCFAF5,#F4F1E8);
  --ink:#1E2A24; --sub:#6E7A72; --rule:rgba(47,93,74,.45); --hair:rgba(47,93,74,.15);
  --edge:rgba(47,93,74,.25); --glow:rgba(47,93,74,.06)}
.slide.vertical{aspect-ratio:9/16}
.slide.wide{aspect-ratio:16/9}

.paper{position:relative;flex:1;display:flex;flex-direction:column;color:var(--ink);
  padding:15px 16px 13px;overflow:hidden;background:var(--page);
  border:1px solid var(--edge);border-radius:3px;
  box-shadow:0 0 30px var(--glow) inset}
/* faint geometric weave — reads as texture, not decoration */
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    repeating-linear-gradient(45deg, var(--hair) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(-45deg, var(--hair) 0 1px, transparent 1px 22px);
  mask-image:radial-gradient(120% 90% at 50% 50%, transparent 30%, #000 100%);
  -webkit-mask-image:radial-gradient(120% 90% at 50% 50%, transparent 30%, #000 100%)}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 95% at 50% 45%, transparent 50%, var(--glow) 100%)}

.s-top{position:relative;display:flex;align-items:stretch;text-align:center}
.s-cell{flex:1;padding:0 6px;line-height:1.25}
.s-cell:not(:last-child){border-inline-end:1px solid var(--hair)}
.s-cell b{display:block;font-family:var(--serif);font-weight:700;font-size:clamp(10px,2.6vw,13px);
  color:var(--ink);text-wrap:balance}
.s-cell i{display:block;font-family:var(--serif);font-style:normal;font-size:clamp(7.5px,2vw,10px);
  color:var(--sub);direction:ltr;margin-top:1px;letter-spacing:.04em}
.s-hr{position:relative;height:1px;margin:9px 0;flex:none;
  background:linear-gradient(90deg,transparent,var(--rule) 18%,var(--rule) 82%,transparent)}
/* the rule under the header carries a small centred lozenge */
.s-hr.key::after{content:"";position:absolute;top:-3px;left:50%;width:7px;height:7px;margin-left:-3.5px;
  transform:rotate(45deg);background:var(--page);border:1px solid var(--rule)}

.s-main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;padding:6px;text-align:center;min-height:0}
.s-text{font-family:var(--quran);font-size:clamp(17px,4.9vw,26px);line-height:2.1;margin:0;color:var(--ink)}
.slide.hadith .s-text{font-family:var(--serif);font-weight:700;font-size:clamp(16px,4.5vw,24px);line-height:1.95}
.s-attr{font-family:var(--serif);font-size:clamp(10px,2.5vw,12.5px);color:var(--sub)}
.s-row{position:relative;text-align:center;padding:2px 6px}
.s-row .cap{font-family:var(--serif);font-size:clamp(8px,2vw,10px);color:var(--sub);margin-bottom:3px;
  letter-spacing:.03em}
.s-row .ar{font-family:var(--serif);font-size:clamp(11px,2.9vw,14px);line-height:1.85;color:var(--ink);opacity:.92}
.s-row .en{font-family:var(--serif);font-size:clamp(10px,2.6vw,13px);line-height:1.6;color:var(--ink);
  direction:ltr;opacity:.92}
.s-row.locked .ar{color:var(--sub);opacity:1}

.s-foot{position:relative;display:flex;align-items:center;gap:9px;font-family:var(--serif);
  font-size:clamp(9px,2.3vw,11.5px);color:var(--sub);letter-spacing:.06em}
.s-foot .dots{flex:1;height:1px;background-image:radial-gradient(circle,var(--rule) 1px,transparent 1px);
  background-size:5px 1px;background-repeat:repeat-x;opacity:.8}
.s-foot .wm{white-space:nowrap}
.s-foot .wm.ltr{direction:ltr}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);font-size:13px}
.act:hover{border-color:var(--gold-dim)}
.act.primary{background:linear-gradient(180deg,#D8B155,#B98F32);color:#231A06;border-color:transparent;font-weight:600}

/* sources registry */
.reg{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:#171410;overflow:hidden}
.reg-hd{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line-soft);background:#1D1912}
.reg-hd h3{margin:0;font-size:13.5px;font-weight:600}
.reg-hd .count{margin-inline-start:auto;font-family:var(--mono);font-size:11px;color:var(--gold);
  border:1px solid var(--gold-dim);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.reg-g{border-bottom:1px solid var(--line-soft)}
.reg-g:last-child{border-bottom:0}
.reg-g h4{margin:0;padding:9px 13px 5px;font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:.02em}
.reg-g ol{margin:0;padding:0 13px 10px;list-style:none;display:flex;flex-direction:column;gap:5px}
.reg-g li{display:flex;gap:8px;font-size:12.5px;line-height:1.6;color:var(--paper-dim)}
.reg-g li i{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--paper-faint);flex:none;margin-top:3px;
  font-variant-numeric:tabular-nums;min-width:16px}
.reg-g li.star{color:var(--paper)}
.reg-g li.star i{color:var(--gold)}
.srcbox{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:#171410}
.srcbox h4{margin:0 0 7px;font-size:12px;color:var(--paper-dim);font-weight:600}
.srcbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.srcbox li{font-size:12.5px;color:var(--paper-dim);line-height:1.6;display:flex;gap:7px}
.srcbox li span{color:var(--gold);font-family:var(--mono);font-size:11px;flex:none;margin-top:2px}

/* ---------- composer ---------- */
.composer{position:sticky;bottom:0;padding:10px 14px 14px;background:rgba(19,16,11,.92);
  backdrop-filter:blur(10px);border-top:1px solid var(--line-soft)}
.cmds{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.cmds::-webkit-scrollbar{display:none}
.cmd{font-family:var(--mono);font-size:11.5px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);
  color:var(--paper-dim);white-space:nowrap;direction:ltr}
.cmd:hover{border-color:var(--gold-dim);color:var(--gold)}
.cbar{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:13px;
  background:var(--ink-2);padding:8px 10px}
.cbar input{flex:1;border:0;background:none;padding:5px 2px;font-size:14.5px}
.cbar input:focus{outline:none}
.send{width:34px;height:34px;flex:none;border-radius:10px;background:var(--ink-3);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--gold)}
.send:hover{background:#2A251A}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);opacity:0;
  background:#2A251A;border:1px solid var(--line);color:var(--paper);padding:10px 15px;border-radius:11px;
  font-size:13px;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.note{font-size:11.5px;color:var(--paper-faint);line-height:1.75;padding:0 16px 20px;text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="frame">

  <!-- ================= AUTH ================= -->
  <section id="auth">
    <div class="brandwrap">
      <svg class="mark" width="66" height="66" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <g stroke="#C9A247" stroke-width="1.6">
          <rect x="22" y="22" width="56" height="56" transform="rotate(0 50 50)"/>
          <rect x="22" y="22" width="56" height="56" transform="rotate(45 50 50)"/>
          <circle cx="50" cy="50" r="34" stroke="#8A6F2E"/>
          <circle cx="50" cy="50" r="12" stroke="#8A6F2E"/>
        </g>
      </svg>
      <h1 class="brand-name">فلاح</h1>
      <p class="brand-sub">وكيلك لصناعة المحتوى الإسلامي — يسألك، يجمع، يتحقّق، ثم يُخرج البطاقة جاهزة للنشر.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:11px">
      <div class="field">
        <label for="em">البريد الإلكتروني</label>
        <input id="em" type="email" inputmode="email" placeholder="name@example.com" autocomplete="off">
      </div>
      <button class="btn btn-gold" id="go">إنشاء حساب ومتابعة</button>
      <div class="rule">أو</div>
      <button class="btn btn-ghost" id="go2">المتابعة كضيف — جولة تجريبية</button>
    </div>

    <p class="legal">يعمل على قاعدة فلاح الحقيقية — كل نص وحكم وفحص تراه مصدَّر منها.<br>الذكاء الاصطناعي لا يكتب آية ولا حديثًا ولا درجةً ولا تفسيرًا.</p>
  </section>

  <!-- ================= APP ================= -->
  <section id="app" hidden>
    <header class="topbar">
      <svg width="22" height="22" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <g stroke="#C9A247" stroke-width="3">
          <rect x="24" y="24" width="52" height="52"/>
          <rect x="24" y="24" width="52" height="52" transform="rotate(45 50 50)"/>
        </g>
      </svg>
      <span class="t-name">فلاح</span>
      <span class="spacer"></span>
      <span class="chip" id="chipTpl">لم يُختر قالب</span>

bdullah (bin Qais)! How do you recite the Qur'an ?\" Abu Musa said, \"I recite the Qur'an \nregularly at intervals and piecemeal. How do you recite it O Mu`adh?\" Mu`adh said, \"I sleep in the \nfirst part of the night and then get up after having slept for the time devoted for my sleep and then \nrecite as much as Allah has written for me. So I seek Allah's Reward for both my sleep as well as my \nprayer (at night).","source":"الترجمة الإنجليزية — Sunnah.com"},"provenance":{"source":"الكتب التسعة — نصوص مفهرسة","edition":"v1.2.0","origin":"hadith-json v1.2.0 (Sunnah.com)","license":"يحتاج مراجعة ترخيص"},"sources":{"second_source":"hadith-api (Sunnah.com)","status":"confirmed"},"report":{"passed":25,"total":25,"stages":[{"name":"أصل المصدر","passed":5,"count":5,"checks":[["المصدر مُدرج في سجل المصادر المعتمدة",1,"الكتب التسعة — نصوص مفهرسة"],["بصمة النص المخزَّن تطابق إعادة الحساب",1,"1 نصًا"],["طبعة المصدر وإصداره مسجَّلان لا مجهولان",1,"v1.2.0"],["للنص شاهد في أكثر من مرجع",1,"عدد المراجع: 3"],["أصل البيانات معلوم ومسجَّل",1,"hadith-json v1.2.0 (Sunnah.com)"]]},{"name":"سلامة النص","passed":6,"count":6,"checks":[["مطابقة حرفية للنص المخزَّن في المصدر",1,"diff=0"],["تطابق النص بين المراجع",1,"تأكّد من مصدر ثانٍ"],["التشكيل موجود بنسبة معتبرة",1,"نسبة التشكيل 0.92"],["الرسم والضبط كما ورد في المصدر",1,"quotation-marks"],["لا محارف تحكّم أو اتجاه داخل النص",1,"نظيف"],["التطبيع لا يغيّر حرفًا من النص",1,"التطبيع لا يمسّ الضبط"]]},{"name":"الموضع والإسناد","passed":5,"count":5,"checks":[["الموضع موجود في المصدر",1,"صحيح البخاري — كتاب المغازى"],["الترقيم مطابق للترقيم المعتمد",1,"رقم 4154"],["الدرجة منقولة من مصدر معتمد لا مُولّدة",1,"شرط الإمام البخاري في جامعه الصحيح"],["التخريج مذكور كاملًا",1,"الكتاب ورقمه مثبتان · الجامع الكامل مج8 كتاب سيرة"],["الرواية معلنة في بيانات المحتوى",1,"صحيح البخاري"]]},{"name":"سلامة المعنى","passed":4,"count":4,"checks":[["النص كامل غير مقتطع",1,"quotation-marks"],["السياق قبله وبعده متاح للمراجعة",1,"السند الكامل محفوظ مع البطاقة"],[ n came to Allah's Messenger (ﷺ) and said, \"I am ruined.\" The Prophet (ﷺ) asked, \"What do you mean?\" He \nsaid, \"I had a sexual intercourse with my wife during Ramadan (while fasting).\" The Prophet (ﷺ) asked \nhim, \"Can you manumit a slave?\" He replied in the negative. He then asked him, \"Can you fast for \ntwo successive months continuously\" He replied in the negative. The Prophet (ﷺ) then asked him, \"Can \nyou feed sixty poor persons?\" He replied in the negative. In the meantime an Ansari came with a \nbasket full of dates. The Prophet (ﷺ) said to the man, \"Take it and give it in charity (as an expiation of \nyour sin).\" The man said \"Should I give it to some people who are poorer than we O Allah's Messenger (ﷺ)? \nBy Him Who has sent you with the Truth, there is no family between Medina's two mountains poorer \nthan we.\" Allah's Messenger (ﷺ) told him to take it and provide his family with it.\"","source":"الترجمة الإنجليزية — Sunnah.com"},"provenance":{"source":"الكتب التسعة — نصوص مفهرسة","edition":"v1.2.0","origin":"hadith-json v1.2.0 (Sunnah.com)","license":"يحتاج مراجعة ترخيص"},"sources":{"second_source":"hadith-api (Sunnah.com)","status":"confirmed"},"report":{"passed":25,"total":25,"stages":[{"name":"أصل المصدر","passed":5,"count":5,"checks":[["المصدر مُدرج في سجل المصادر المعتمدة",1,"الكتب التسعة — نصوص مفهرسة"],["بصمة النص المخزَّن تطابق إعادة الحساب",1,"1 نصًا"],["طبعة المصدر وإصداره مسجَّلان لا مجهولان",1,"v1.2.0"],["للنص شاهد في أكثر من مرجع",1,"عدد المراجع: 4"],["أصل البيانات معلوم ومسجَّل",1,"hadith-json v1.2.0 (Sunnah.com)"]]},{"name":"سلامة النص","passed":6,"count":6,"checks":[["مطابقة حرفية للنص المخزَّن في المصدر",1,"diff=0"],["تطابق النص بين المراجع",1,"تأكّد من مصدر ثانٍ"],["التشكيل موجود بنسبة معتبرة",1,"نسبة التشكيل 0.89"],["الرسم والضبط كما ورد في المصدر",1,"quotation-marks"],["لا محارف تحكّم أو اتجاه داخل النص",1,"نظيف"],["التطبيع لا يغيّر حرفًا من النص",1,"التطبيع لا يمسّ الضبط"]]},{"name":"الموضع والإسناد","passed":5,"coun s the Prophet (ﷺ) had said it.' `Umar said, 'No doubt, you are bold. \nHow did he say it?' I said, 'A man's afflictions (wrong deeds) concerning his wife, children and \nneighbors are expiated by (his) prayers, charity, and enjoining good.' (The sub-narrator Sulaiman \nadded that he said, 'The prayer, charity, enjoining good and forbidding evil.') `Umar said, 'I did not \nmean that, but I ask about that affliction which will spread like the waves of the sea.' I said, 'O chief of \nthe believers! You need not be afraid of it as there is a closed door between you and it.' He asked, \n'Will the door be broken or opened?' I replied, 'No, it will be broken.' He said, 'Then, if it is broken, it \nwill never be closed again?' I replied, 'Yes.' \" Then we were afraid to ask what that door was, so we \nasked Masruq to inquire, and he asked Hudhaifa regarding it. Hudhaifa said, \"The door was `Umar. \n\"We further asked Hudhaifa whether `Umar knew what that door meant. Hudhaifa replied in the \naffirmative and added, \"He knew it as one knows that there will be a night before the tomorrow \nmorning.\"","source":"الترجمة الإنجليزية — Sunnah.com"},"provenance":{"source":"الكتب التسعة — نصوص مفهرسة","edition":"v1.2.0","origin":"hadith-json v1.2.0 (Sunnah.com)","license":"يحتاج مراجعة ترخيص"},"sources":{"second_source":"hadith-api (Sunnah.com)","status":"confirmed"},"report":{"passed":25,"total":25,"stages":[{"name":"أصل المصدر","passed":5,"count":5,"checks":[["المصدر مُدرج في سجل المصادر المعتمدة",1,"الكتب التسعة — نصوص مفهرسة"],["بصمة النص المخزَّن تطابق إعادة الحساب",1,"1 نصًا"],["طبعة المصدر وإصداره مسجَّلان لا مجهولان",1,"v1.2.0"],["للنص شاهد في أكثر من مرجع",1,"عدد المراجع: 3"],["أصل البيانات معلوم ومسجَّل",1,"hadith-json v1.2.0 (Sunnah.com)"]]},{"name":"سلامة النص","passed":6,"count":6,"checks":[["مطابقة حرفية للنص المخزَّن في المصدر",1,"diff=0"],["تطابق النص بين المراجع",1,"تأكّد من مصدر ثانٍ"],["التشكيل موجود بنسبة معتبرة",1,"نسبة التشكيل 0.78"],["الرسم والضبط كما ورد في ) left and went towards the dwelling place of Aisha and said, \"Peace and Allah's Mercy be \non you, O the people of the house!\" She replied, \"Peace and the mercy of Allah be on you too. How \ndid you find your wife? May Allah bless you. Then he went to the dwelling places of all his other \nwives and said to them the same as he said to Aisha and they said to him the same as Aisha had said to \nhim. Then the Prophet (ﷺ) returned and found a group of three persons still in the house chatting. The \nProphet was a very shy person, so he went out (for the second time) and went towards the dwelling \nplace of `Aisha. I do not remember whether I informed him that the people have gone away. So he \nreturned and as soon as he entered the gate, he drew the curtain between me and him, and then the \nVerse of Al-Hijab was revealed.","source":"الترجمة الإنجليزية — Sunnah.com"},"provenance":{"source":"الكتب التسعة — نصوص مفهرسة","edition":"v1.2.0","origin":"hadith-json v1.2.0 (Sunnah.com)","license":"يحتاج مراجعة ترخيص"},"sources":{"second_source":"hadith-api (Sunnah.com)","status":"confirmed"},"report":{"passed":25,"total":25,"stages":[{"name":"أصل المصدر","passed":5,"count":5,"checks":[["المصدر مُدرج في سجل المصادر المعتمدة",1,"الكتب التسعة — نصوص مفهرسة"],["بصمة النص المخزَّن تطابق إعادة الحساب",1,"1 نصًا"],["طبعة المصدر وإصداره مسجَّلان لا مجهولان",1,"v1.2.0"],["للنص شاهد في أكثر من مرجع",1,"عدد المراجع: 3"],["أصل البيانات معلوم ومسجَّل",1,"hadith-json v1.2.0 (Sunnah.com)"]]},{"name":"سلامة النص","passed":6,"count":6,"checks":[["مطابقة حرفية للنص المخزَّن في المصدر",1,"diff=0"],["تطابق النص بين المراجع",1,"تأكّد من مصدر ثانٍ"],["التشكيل موجود بنسبة معتبرة",1,"نسبة التشكيل 0.86"],["الرسم والضبط كما ورد في المصدر",1,"quotation-marks"],["لا محارف تحكّم أو اتجاه داخل النص",1,"نظيف"],["التطبيع لا يغيّر حرفًا من النص",1,"التطبيع لا يمسّ الضبط"]]},{"name":"الموضع والإسناد","passed":5,"count":5,"checks":[["الموضع موجود في المصدر",1,"صحيح البخاري — كتاب التفسير"],["الترقيم مطابق لل   var STATS = DB.stats, TOPICS = DB.topics, SOURCES = DB.sources;

  /* ═══ منطق الوكيل — يعمل كله على لقطة القاعدة الحقيقية أعلاه ═══

  var S = {kind:null, topic:null, item:null, ratio:"square",
           extras:"both", wm:"", swap:false, skin:"night"};
  var SKINS = [["night","ليلي مذهّب"],["parch","رقّ"],["ivory","نقي"]];

  var stream  = document.getElementById("stream");
  var chipTpl = document.getElementById("chipTpl");

  var AR = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
  function num(n){ return String(n).split("").map(function(d){return AR[+d]||d;}).join(""); }
  function el(tag, cls, html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
  function esc(s){var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML;}
  function scroll(){ requestAnimationFrame(function(){ window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}); }); }
  function toast(t){
    var e=document.getElementById("toast"); e.textContent=t; e.classList.add("show");
    clearTimeout(e._t); e._t=setTimeout(function(){e.classList.remove("show");},2400);
  }

  var AGENT_AV = '<svg width="13" height="13" viewBox="0 0 100 100" fill="none"><g stroke="#C9A247" stroke-width="6"><rect x="26" y="26" width="48" height="48"/><rect x="26" y="26" width="48" height="48" transform="rotate(45 50 50)"/></g></svg>';

  function agent(html){
    var m = el("div","msg");
    m.appendChild(el("div","av",AGENT_AV));
    var b = el("div","bubble",html); m.appendChild(b);
    stream.appendChild(m); scroll(); return b;
  }
  function me(text){
    var m = el("div","msg me");
    m.appendChild(el("div","av",'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7E7563" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>'));
    m.appendChild(el("div","bubble",esc(text)));
    stream.appendChild(m); scroll();
  }
  function thinking(label, ms, done){
    var m = el("div","msg");
    m.appendChild(el("div","av",AGENT_AV));
    m.appendChild(el("div","bubble",'<div class="think"><span class="dot"></span><span class="dot"></span><span class="dot"></span>'+label+'</div>'));
    stream.appendChild(m); scroll();
    setTimeout(function(){ m.remove(); done(); }, ms);
  }
  function ask(question, example, options, onPick){
    var b = agent('<div>'+question+'</div>' + (example?'<div class="example"><b>مثال على الإجابة:</b> '+example+'</div>':''));
    var wrap = el("div","opts");
    options.forEach(function(o){
      var btn = el("button","opt", esc(o.label) + (o.sub?'<span class="sub">'+esc(o.sub)+'</span>':''));
      btn.onclick = function(){ wrap.remove(); me(o.label); onPick(o); };
      wrap.appendChild(btn);
    });
    b.appendChild(wrap); scroll();
  }
  function askText(question, example, placeholder, onSubmit){
    var b = agent('<div>'+question+'</div><div class="example"><b>مثال على الإجابة:</b> '+example+'</div>');
    var f = el("div","inline-form");
    var i = el("input"); i.type="text"; i.placeholder=placeholder;
    var s = el("button","opt","تم");
    function submit(){ var v=(i.value||placeholder).trim(); f.remove(); me(v); onSubmit(v); }
    s.onclick=submit; i.onkeydown=function(e){ if(e.key==="Enter") submit(); };
    f.appendChild(i); f.appendChild(s); b.appendChild(f); scroll(); i.focus();
  }

  /* ─────────────── التدفق ─────────────── */
  function start(greetName){
    stream.innerHTML="";
    S = {kind:null,topic:null,item:null,ratio:"square",extras:"both",wm:"",swap:false,skin:S.skin||"night"};
    chipTpl.textContent="لم يُختر قالب"; chipTpl.classList.remove("on");
    agent('السلام عليكم'+(greetName?'، '+esc(greetName):'')+
      '. أشتغل على قاعدة فيها <b>'+num(STATS.ayat)+'</b> آية و<b>'+num(STATS.hadiths)+
      '</b> حديثًا، اجتاز منها <b>'+num(STATS.ayat_ready+STATS.hadiths_ready)+
      '</b> كل الفحوص. سأسألك سؤالًا واحدًا في كل مرة.');
    setTimeout(step1, 500);
  }

  function step1(){
    ask("ما نوع المحتوى الذي تريد صناعته؟","بطاقة آية قرآنية",[
      {label:"قالب القرآن الكريم", sub:num(STATS.ayat_ready)+" آية جاهزة", v:"quran"},
      {label:"قالب الحديث الشريف", sub:num(STATS.hadiths_ready)+" حديثًا جاهزًا", v:"hadith"}
    ], function(o){
      S.kind=o.v;
      chipTpl.textContent = o.v==="quran"?"قالب القرآن":"قالب الحديث";
      chipTpl.classList.add("on");
      setTimeout(step2,320);
    });
  }

  function step2(){
    var avail = TOPICS.filter(function(t){ return t[S.kind].length; });
    ask("ما الموضوع؟ هذه موضوعات مفهرسة على القاعدة، ومادتها مفحوصة مسبقًا.",
        avail.length ? avail[3 % avail.length].name : "الصبر",
        avail.map(function(t,i){ return {label:t.name, sub:num(t[S.kind].length)+" مادة", v:i}; }),
        function(o){ S.topic = avail[o.v]; setTimeout(step3,320); });
  }

  function step3(){
    var items = S.topic[S.kind];
    ask("اختر النص. المعروض هنا مأخوذ من القاعدة بموضعه وحكمه.",
        items[0] ? items[0].cells.c1[0] : "",
        items.map(function(it,i){
          var sub = S.kind==="quran"
            ? it.cells.c1[0]+" · "+it.cells.c4[0]
            : it.cells.c1[0]+" "+it.cells.c3[0]+" · "+it.cells.c4[0];
          return {label: it.text.length>58 ? it.text.slice(0,58)+"…" : it.text, sub:sub, v:i};
        }),
        function(o){ S.item = items[o.v]; setTimeout(step4,320); });
  }

  function step4(){
    ask("أين ستنشرها؟ يحدّد هذا مقاس البطاقة.","انستقرام — مربع ١:١",[
      {label:"انستقرام — مربع", sub:"1080 × 1080", v:"square"},
      {label:"تيك توك / ريلز — عمودي", sub:"1080 × 1920", v:"vertical"},
      {label:"يوتيوب — عريض", sub:"1920 × 1080", v:"wide"}
    ], function(o){ S.ratio=o.v; setTimeout(step5,320); });
  }

  function step5(){
    var it = S.item, opts = [];
    if(it.translation) opts.push({label:it.translation.source, v:"tr"});
    if(it.tafsir)      opts.push({label:(S.kind==="quran"?"تفسير — ":"شرح — ")+it.tafsir.source, v:"tf"});
    if(it.translation && it.tafsir) opts.push({label:"كلاهما", v:"both"});
    opts.push({label:"النص وحده", v:"none"});
    ask("ماذا يظهر تحت النص؟ هذه المصادر المتوفّرة لهذا النص بعينه.",
        opts[0].label, opts, function(o){ S.extras=o.v; setTimeout(step6,320); });
  }

  function step6(){
    askText("ما الاسم الذي يظهر في علامتك المائية؟","قناة نور الهدى","قناة نور الهدى",
      function(v){ S.wm=v; setTimeout(gather,320); });
  }

  /* ─────────────── الجلب ثم الفحص ─────────────── */
  function gather(){
    thinking("أجلب النص من مصدره…", 900, function(){
      var it = S.item, p = it.provenance;
      var rows = '<div class="cmp-row"><span class="s">'+esc(p.source)+'</span>'+
                 '<span class="v ok">'+esc(p.edition||"")+'</span></div>';
      if(S.kind==="quran"){
        rows += '<div class="cmp-row"><span class="s">'+esc(it.sources.second_source)+'</span>'+
                '<span class="v ok">'+(it.sources.status[0]==="exact"?"MATCH · diff 0":"MATCH · رسم")+'</span></div>';
        if(it.sources.basmala_stripped)
          rows += '<div class="cmp-row"><span class="s">البسملة الملحقة</span><span class="v ok">نُزعت</span></div>';
      }else{
        rows += '<div class="cmp-row"><span class="s">'+esc(it.sources.second_source)+'</span>'+
                '<span class="v '+(it.sources.status==="confirmed"?"ok":"bad")+'">'+
                (it.sources.status==="confirmed"?"CONFIRMED":"SINGLE")+'</span></div>';
        if(it.jami)
          rows += '<div class="cmp-row"><span class="s">الجامع الكامل — الأعظمي · مج'+num(it.jami.volume)+
                  '</span><span class="v ok">'+esc(it.jami.match)+'</span></div>';
      }
      var b = agent('لم أكتب النص — جلبتُه. هذه مصادره:');
      b.appendChild(el("div","cmp",
        '<div class="cmp-hd">النص كما ورد، ومن أين جاء</div>'+
        '<div class="cmp-txt">'+esc(it.text)+'</div>'+rows));
      scroll();
      setTimeout(function(){
        agent('الآن أعرض عليك تقرير الفحوص كما أخرجه المحرّك على هذا النص بعينه.');
        setTimeout(runChecks, 480);
      }, 900);
    });
  }

  /* يعرض تقرير الفحص الحقيقي المخزَّن مع البطاقة */
  function runChecks(){
    var rep = S.item.report, total = rep.total;
    var b = agent("");
    var panel = el("div","panel");
    var prog = el("span","prog", num(0)+" / "+num(total));
    var skip = el("button","chip","تخطّي العرض");
    var hd = el("div","panel-hd",'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9A247" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg><h3>سلسلة التحقّق — '+num(total)+' فحصًا</h3>');
    hd.appendChild(el("span","spacer")); hd.appendChild(prog); hd.appendChild(skip);
    panel.appendChild(hd); b.appendChild(panel); scroll();

    var flat = [], stageEls = [];
    rep.stages.forEach(function(st, si){
      var sEl = el("div","stage");
      var sHd = el("button","stage-hd",'<span class="n">'+num(si+1)+'</span><span>'+esc(st.name)+
                   '</span><span class="tally">0/'+num(st.count)+'</span>');
      var sBd = el("div","stage-bd");
      sHd.onclick = function(){ sBd.hidden = !sBd.hidden; };
      sEl.appendChild(sHd); sEl.appendChild(sBd); panel.appendChild(sEl);
      stageEls.push({el:sEl, bd:sBd, tally:sHd.querySelector(".tally"), n:st.count, passed:0});
      st.checks.forEach(function(ck){
        var r = el("div","check",'<span class="st"></span><span class="lbl">'+esc(ck[0])+
                  '<span class="src">'+esc(ck[2]||"")+'</span></span>');
        sBd.appendChild(r);
        flat.push({row:r, ok:ck[1], si:si});
      });
    });

    var i=0, fast=false;
    skip.onclick = function(){ fast = true; skip.remove(); };
    (function next(){
      if(i >= flat.length){
        var allok = rep.passed === total;
        var v = el("div","verdict "+(allok?"ok":"no"),
          (allok
            ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg><span>اجتاز '+num(rep.passed)+' من '+num(total)+' — المحتوى موثّق</span>'
            : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg><span>سقط فحص — لن يُنتَج المحتوى</span>'));
        panel.appendChild(v); if(skip.parentNode) skip.remove(); scroll();
        setTimeout(render, 520); return;
      }
      var it2 = flat[i], r = it2.row, st = stageEls[it2.si];
      r.classList.add("live");
      setTimeout(function(){
        r.classList.remove("live");
        r.classList.add("done", it2.ok ? "pass" : "fail");
        r.querySelector(".st").textContent = it2.ok ? "✓" : "✕";
        if(it2.ok) st.passed++;
        st.tally.textContent = num(st.passed)+"/"+num(st.n);
        if(st.passed===st.n){ st.el.classList.add("pass"); st.bd.hidden = true; }
        i++; prog.textContent = num(i)+" / "+num(total);
        if(!fast) scroll();
        next();
      }, fast ? 18 : (105 + Math.random()*120));
    })();
  }

  /* ─────────────── البطاقة ─────────────── */
  function slideHTML(){
    var it = S.item, isQ = S.kind==="quran";
    var showTr = (S.extras==="tr" || S.extras==="both") && it.translation;
    var showTf = (S.extras==="tf" || S.extras==="both") && it.tafsir;
    var cell = function(c){ return '<div class="s-cell"><b>'+esc(c[0])+'</b><i>'+esc(c[1])+'</i></div>'; };
    var top = '<div class="s-top">'+cell(it.cells.c1)+cell(it.cells.c2)+cell(it.cells.c3)+cell(it.cells.c4)+'</div>';

    var rows = "";
    if(showTf) rows += '<div class="s-hr"></div><div class="s-row">'+
      '<div class="cap">'+esc(it.tafsir.source)+'</div>'+
      '<div class="ar">'+esc(it.tafsir.text.length>240?it.tafsir.text.slice(0,240)+"…":it.tafsir.text)+'</div></div>';
    if(showTr) rows += '<div class="s-hr"></div><div class="s-row">'+
      '<div class="cap">'+esc(it.translation.source)+'</div>'+
      '<div class="en">'+esc(it.translation.text.length>200?it.translation.text.slice(0,200)+"…":it.translation.text)+'</div></div>';

    var appWm  = '<span class="wm ltr">FALAH</span>';
    var userWm = '<span class="wm">'+esc(S.wm||"قناتك")+'</span>';

    return '<div class="slide '+(isQ?"quran":"hadith")+' '+
      (S.ratio==="vertical"?"vertical":S.ratio==="wide"?"wide":"")+'" data-skin="'+S.skin+'">'+
      '<div class="paper">'+ top +'<div class="s-hr key"></div>'+
        '<div class="s-main">'+
          '<p class="s-text">'+(isQ?'﴿ '+esc(it.text)+' ﴾':'«'+esc(it.text)+'»')+'</p>'+
          (isQ?'':'<div class="s-attr">'+esc(it.narrator||"")+(it.narrator&&it.takhrij&&it.takhrij.length?' · ':'')+
                 esc((it.takhrij||[]).join(" — "))+'</div>')+
        '</div>'+ rows +'<div class="s-hr"></div>'+
        '<div class="s-foot">'+(S.swap?appWm:userWm)+'<span class="dots"></span>'+(S.swap?userWm:appWm)+'</div>'+
      '</div></div>';
  }

  function render(){
    var it = S.item;
    var b = agent('جاهزة. هذه البطاقة من '+(S.kind==="quran"?"قالب القرآن":"قالب الحديث")+'.');
    var w = el("div","slidewrap"); w.innerHTML = slideHTML(); b.appendChild(w);

    var skins = el("div","actions");
    var lab = el("span","act","شكل البطاقة");
    lab.style.cssText="border:0;background:none;color:var(--paper-faint);padding-inline:0;font-size:12px";
    skins.appendChild(lab);
    SKINS.forEach(function(sk){
      var btn = el("button","act"+(S.skin===sk[0]?" primary":""), sk[1]);
      btn.onclick = function(){
        S.skin = sk[0]; w.innerHTML = slideHTML();
        Array.prototype.forEach.call(skins.querySelectorAll("button"), function(x){ x.classList.remove("primary"); });
        btn.classList.add("primary");
      };
      skins.appendChild(btn);
    });
    b.appendChild(skins);

    var li = [];
    li.push(["النص", it.provenance.source + (it.provenance.riwayah? " — "+it.provenance.riwayah : "")]);
    li.push(["الموضع", it.cells.c1[0] + " · " + it.cells.c3[0] + " · " + it.cells.c4[0]]);
    if(S.kind==="hadith"){
      if(it.grade) li.push(["الحكم", it.grade + (it.grade_by? " — بحكم "+it.grade_by : "") +
                                     (it.grade_basis? " ("+it.grade_basis+")" : "")]);
      if(it.grade_all && it.grade_all.length>1)
        li.push(["أحكام أخرى", it.grade_all.map(function(g){return g.by+": "+g.grade;}).join(" · ")]);
      if(it.takhrij && it.takhrij.length) li.push(["التخريج", it.takhrij.join(" — ")]);
      if(it.jami){
        li.push(["الجامع الكامل", "مج"+num(it.jami.volume)+" · "+(it.jami.chapter||"")+
                                  (it.jami.bab? " · "+it.jami.bab : "")]);
        if(it.jami.takhrij_in_book) li.push(["تخريجه عند الأعظمي", it.jami.takhrij_in_book]);
      }
      li.push(["التحقق", it.sources.status==="confirmed" ? "تأكّد النص من مصدر ثانٍ" : "مصدر واحد"]);
    }else{
      li.push(["المصدر الثاني", it.sources.second_source + " — " + it.sources.status.join("، ")]);
    }
    if(it.tafsir) li.push(["التفسير", it.tafsir.source]);
    if(it.translation) li.push(["الترجمة", it.translation.source]);
    li.push(["الفحص", "اجتاز "+num(it.report.passed)+" من "+num(it.report.total)]);
    li.push(["الترخيص", it.provenance.license]);
    b.appendChild(el("div","srcbox",'<h4>الإسناد المخزَّن مع البطاقة</h4><ul>'+
      li.map(function(x){ return '<li><span>'+esc(x[0])+'</span>'+esc(x[1])+'</li>'; }).join("")+'</ul>'));

    var acts = el("div","actions");
    [["تصدير PNG","primary","export"],["جدولة النشر","","schedule"],
     ["تبديل موضع العلامتين","","swap"],["ابدأ من جديد","","reset"]].forEach(function(a){
      var btn = el("button","act "+a[1], a[0]);
      btn.onclick = function(){
        if(a[2]==="export") toast("التصدير معطّل في النموذج");
        else if(a[2]==="schedule") toast("الجدولة من المرحلة الرابعة");
        else if(a[2]==="swap"){ S.swap=!S.swap; w.innerHTML=slideHTML(); }
        else start("");
      };
      acts.appendChild(btn);
    });
    b.appendChild(acts); scroll();
  }

  /* ─────────────── سجل المصادر والإحصاء والرفض ─────────────── */
  function showSources(){
    var b = agent('سجل المصادر كما هو مسجَّل في القاعدة، بحالة ترخيص كل مصدر.');
    var reg = el("div","reg");
    reg.appendChild(el("div","reg-hd",'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9A247" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 5.5v15"/></svg><h3>سجل المصادر</h3><span class="count">'+num(SOURCES.length)+'</span>'));
    var byKind = {};
    SOURCES.forEach(function(s){ (byKind[s.kind] = byKind[s.kind] || []).push(s); });
    var NAMES = {quran:"النص القرآني", tafsir:"التفسير", translation:"الترجمة",
                 hadith:"الحديث", "hadith-witness":"الشواهد"};
    var i = 0;
    Object.keys(byKind).forEach(function(k){
      var g = el("div","reg-g",'<h4>'+(NAMES[k]||k)+'</h4>');
      var ol = el("ol");
      byKind[k].forEach(function(s){
        i++;
        var star = s.code === "jami.kamil";
        ol.appendChild(el("li", star?"star":"",
          '<i>'+num(i)+'</i><span>'+esc(s.name)+
          (s.riwayah? ' — '+esc(s.riwayah):'')+
          '<br><span style="color:var(--paper-faint);font-size:11px">'+esc(s.origin)+' · '+esc(s.license_status)+'</span></span>'));
      });
      g.appendChild(ol); reg.appendChild(g);
    });
    b.appendChild(reg); scroll();
  }

  function showStats(){
    var b = agent('حال القاعدة التي أشتغل عليها:');
    var rows = [
      ["آيات القرآن", STATS.ayat, STATS.ayat_ready],
      ["الأحاديث", STATS.hadiths, STATS.hadiths_ready],
      ["شهد لها الجامع الكامل", STATS.jami, STATS.jami_ready],
      ["أحاديث لها حكم بمستند", STATS.graded, null],
      ["مجموعات التخريج المتقاطع", STATS.takhrij, null],
      ["البسملة المُلحقة التي نُزعت", STATS.basmala_fixed, null],
      ["آيات اختلف فيها المصدران", STATS.quran_conflicts, null],
      ["طابور المراجعة", STATS.review, null]
    ];
    b.appendChild(el("div","srcbox",'<h4>الأرقام</h4><ul>'+rows.map(function(r){
      return '<li><span>'+num(r[1])+'</span>'+esc(r[0])+(r[2]!=null?' — يُفرَج عنه '+num(r[2]):'')+'</li>';
    }).join("")+'</ul>'));
    var b2 = el("div","srcbox",'<h4>أسباب الحجب — أعلى عشرة</h4><ul>'+
      DB.review_summary.map(function(r){
        return '<li><span>'+num(r.n)+'</span>'+esc(r.reason)+'</li>';
      }).join("")+'</ul>');
    b.appendChild(b2); scroll();
  }

  function showBlocked(){
    var ex = DB.blocked_examples;
    ask("أيّ حالة رفضٍ حقيقية تريد أن تراها؟ هذه من طابور المراجعة نفسه.",
        "حديث حكمه ضعيف",
        ex.map(function(x,i){
          var lab = x.case==="weak" ? "حديث حكمه "+x.grade
                  : x.case==="conflict" ? "تعارض حكمين على حديث"
                  : "اختلاف المصدرين في آية "+x.ref;
          return {label: lab, sub: x.case==="quran-conflict" ? "قرآن" : x.book, v:i};
        }),
        function(o){ renderBlocked(ex[o.v]); });
  }

  function renderBlocked(x){
    var b, panel = el("div","panel");
    if(x.case === "quran-conflict"){
      b = agent('هذه آية اختلف فيها المصدران المستقلان، فحُجبت. لم أرجّح بينهما ولم أخترع ثالثًا.');
      b.appendChild(el("div","cmp",
        '<div class="cmp-hd">الآية '+esc(x.ref)+' — نصّان من مرجعين</div>'+
        '<div class="cmp-txt">'+esc(x.a)+'</div>'+
        '<div class="cmp-row"><span class="s">المرجع الأول</span><span class="v bad">CONFLICT</span></div>'+
        '<div class="cmp-txt">'+esc(x.b)+'</div>'+
        '<div class="cmp-row"><span class="s">المرجع الثاني</span><span class="v bad">CONFLICT</span></div>'));
    } else {
      b = agent(x.case === "conflict"
        ? 'هذا حديث حكم عليه محدِّثٌ بالصحة، وتحفّظ عليه الأعظمي في الجامع الكامل. عند التعارض أحجب.'
        : 'هذا حديث حكمه '+esc(x.grade)+'، فلا يُنشر — يبقى في القاعدة للاستبعاد لا للنشر.');
      b.appendChild(el("div","cmp",
        '<div class="cmp-hd">'+esc(x.book)+' · رقم '+num(x.no)+'</div>'+
        '<div class="cmp-txt">'+esc(x.text)+'</div>'+
        '<div class="cmp-row"><span class="s">'+esc(x.grade||"بلا حكم")+
          (x.by? ' — بحكم '+esc(x.by):'')+'</span><span class="v bad">BLOCKED</span></div>'+
        (x.jami? '<div class="cmp-row"><span class="s">الجامع الكامل: '+esc(x.jami)+
                 '</span><span class="v bad">CONFLICT</span></div>' : '')));
    }
    var v = el("div","verdict no",'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg><span>'+esc(x.reason)+'</span>');
    b.lastChild.appendChild(v);
    var wrap = el("div","opts");
    var btn = el("button","opt","ابدأ من جديد");
    btn.onclick = function(){ wrap.remove(); start(""); };
    wrap.appendChild(btn); b.appendChild(wrap); scroll();
  }

  /* ─────────────── الأوامر ─────────────── */
  function command(c){
    if(c==="reset"){ start(""); return; }
    if(c==="sources"){ me("/المصادر"); showSources(); return; }
    if(c==="stats"){ me("/الأرقام"); showStats(); return; }
    if(c==="fail"){ me("/تجربة-الرفض"); showBlocked(); return; }
    stream.innerHTML="";
    S.kind = c; S.topic = S.item = null;
    chipTpl.textContent = c==="quran"?"قالب القرآن":"قالب الحديث";
    chipTpl.classList.add("on");
    me(c==="quran"?"/آية":"/حديث");
    step2();
  }

  Array.prototype.forEach.call(document.querySelectorAll(".cmd"), function(b){
    b.onclick = function(){ command(b.dataset.cmd); };
  });
  var chipLock = document.getElementById("chipLock");
  chipLock.textContent = "🔒 " + num(SOURCES.length) + " مصادر";
  chipLock.onclick = showSources;

  var cin = document.getElementById("cin");
  function sendFree(){
    var v = cin.value.trim(); if(!v) return;
    cin.value=""; me(v);
    thinking("أقرأ طلبك…", 700, function(){
      agent("قبل أن أجمع شيئًا، أثبّت القالب. سؤال واحد في كل مرة.");
      setTimeout(step1, 420);
    });
  }
  document.getElementById("csend").onclick = sendFree;
  cin.onkeydown = function(e){ if(e.key==="Enter") sendFree(); };

  function enter(){
    var v = document.getElementById("em").value.trim();
    document.getElementById("auth").hidden = true;
    document.getElementById("app").hidden = false;
    window.scrollTo(0,0);
    start(v ? v.split("@")[0] : "");
  }
  document.getElementById("go").onclick = enter;
  document.getElementById("go2").onclick = enter;
  document.getElementById("em").onkeydown = function(e){ if(e.key==="Enter") enter(); };

})();
</script>
